services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: lead
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: lead_intelligence
    volumes:
      - lead_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead -d lead_intelligence"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lead_pg:
